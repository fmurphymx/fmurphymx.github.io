<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Niebla</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: #0a0a0c;
    color: #d8d4cc;
    overflow: hidden;
  }

  #fogBg {
    position: fixed; inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 1.5s ease;
    opacity: 1;
  }
  #fogBg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(10,10,12,0.15) 0%,
      rgba(10,10,12,0.55) 60%,
      rgba(10,10,12,0.85) 100%);
    pointer-events: none;
  }
  #fogBg.fade { opacity: 0; }

  /* Viñeta de peligro cuando la Presencia baja */
  #dangerVignette {
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
    box-shadow: inset 0 0 200px rgba(139, 20, 20, 0.5);
  }
  #dangerVignette.warn { opacity: 0.4; animation: dangerPulse 2.5s infinite; }
  #dangerVignette.critical { opacity: 0.8; animation: dangerPulse 1.2s infinite; }
  @keyframes dangerPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  .app {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    max-width: 720px;
    width: 100%;
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(180, 180, 200, 0.1);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.5);
    transition: border-color 1s ease;
  }
  .container.danger { border-color: rgba(180, 40, 40, 0.4); }

  h1 {
    font-family: 'Cormorant', Georgia, serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 8px;
    color: #e8e4dc;
    text-align: center;
    margin-bottom: 2px;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }
  .subtitle {
    text-align: center;
    font-size: 10px;
    color: #6a6a72;
    letter-spacing: 4px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* Panel de estrellas de karma */
  .karma-panel {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
    padding: 6px 0;
    min-height: 24px;
  }
  .karma-star {
    font-size: 20px;
    line-height: 1;
    transition: all 0.4s ease;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
  }
  .karma-star.yellow {
    color: #f4d03f;
    text-shadow: 0 0 12px rgba(244, 208, 63, 0.7), 0 0 4px rgba(244, 208, 63, 0.9);
  }
  .karma-star.black {
    color: #1a1a1a;
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 3px rgba(80, 20, 20, 0.8);
    -webkit-text-stroke: 1px #3a2a2a;
  }
  .karma-star.empty {
    color: rgba(80, 80, 90, 0.25);
  }

  /* Deriva */
  .deriva-wrap {
    background: rgba(20, 20, 26, 0.75);
    border: 1px solid rgba(60, 60, 70, 0.4);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .deriva-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
    font-size: 11px;
  }
  .deriva-band { color: #a8c4d8; font-weight: 600; letter-spacing: 1.5px; }
  .deriva-val { color: #e8e4dc; font-family: monospace; font-size: 13px; }
  .deriva-bar {
    display: flex;
    height: 18px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(60, 60, 70, 0.4);
  }
  .band-seg {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.5px;
    position: relative;
    transition: all 0.3s;
  }
  .band-seg.b1 { background: #2a1a1a; }
  .band-seg.b2 { background: #22202a; }
  .band-seg.b3 { background: #20262c; }
  .band-seg.b4 { background: #222630; }
  .band-seg.b5 { background: #262a3a; }
  .band-seg.active { color: #fff; font-weight: bold; }
  .band-seg.active::after {
    content: '';
    position: absolute; inset: 1px;
    border: 1px solid rgba(230,168,80,0.7);
    border-radius: 2px;
    box-shadow: inset 0 0 12px rgba(230,168,80,0.2);
  }
  .band-seg.b1.active { background: #4a1a1a; }
  .band-seg.b2.active { background: #3a2a3a; }
  .band-seg.b3.active { background: #2a3a4a; }
  .band-seg.b4.active { background: #2a3a4a; }
  .band-seg.b5.active { background: #3a3a5a; }

  /* Limbo */
  .limbo-wrap {
    background: rgba(42, 10, 10, 0.85);
    border: 1px solid rgba(139, 58, 42, 0.5);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 12px;
    text-align: center;
    display: none;
    animation: limboPulse 2s infinite;
  }
  .limbo-wrap.active { display: block; }
  @keyframes limboPulse {
    0%, 100% { box-shadow: 0 0 15px rgba(139,58,42,0.2); }
    50% { box-shadow: 0 0 25px rgba(139,58,42,0.4); }
  }
  .limbo-title {
    color: #e88a7a; font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 2px;
  }
  .limbo-count {
    color: #f0e6d2; font-family: monospace; font-size: 22px;
    letter-spacing: 6px; font-weight: bold;
  }

  /* Botones */
  .controls { display: flex; gap: 10px; margin-bottom: 10px; }
  button {
    flex: 1;
    padding: 14px;
    border: 1px solid rgba(80, 80, 90, 0.5);
    background: rgba(28, 28, 34, 0.85);
    color: #e8e4dc;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1.5px;
    backdrop-filter: blur(4px);
  }
  button:hover:not(:disabled) {
    background: rgba(40, 40, 48, 0.95);
    border-color: rgba(140, 140, 160, 0.6);
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.25; cursor: not-allowed; }
  button.walk:hover:not(:disabled) { border-color: #8fa8b8; color: #a8c4d8; }
  button.stay:hover:not(:disabled) { border-color: #a89080; color: #d8c0a8; }

  .extra-controls { display: flex; gap: 8px; margin-bottom: 10px; }
  .extra-controls button {
    padding: 8px; font-size: 12px;
    background: rgba(20, 20, 26, 0.85);
    border-color: rgba(50, 50, 60, 0.5);
  }

  /* Log */
  .log {
    background: rgba(8, 8, 12, 0.8);
    border: 1px solid rgba(40, 40, 50, 0.5);
    border-radius: 8px;
    padding: 12px 16px;
    height: 280px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.65;
    font-family: 'Cormorant', Georgia, serif;
  }
  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .log::-webkit-scrollbar-thumb { background: rgba(60,60,70,0.5); border-radius: 3px; }
  .log .entry { margin-bottom: 6px; opacity: 0; animation: fadeIn 0.5s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  .log .entry.sys { color: #8fa8b8; font-style: italic; font-size: 13px; }
  .log .entry.walk { color: #a8c4d8; }
  .log .entry.stay { color: #d8c0a8; }
  .log .entry.enc { color: #e6a850; font-weight: 600; font-size: 15px; margin-top: 10px; letter-spacing: 1px; }
  .log .entry.dial { color: #d8d4cc; font-style: italic; padding-left: 12px; border-left: 2px solid rgba(80,80,90,0.5); margin: 4px 0 6px 0; }
  .log .entry.q { color: #f0e6d2; font-weight: 500; margin-top: 6px; }
  .log .entry.opt { color: #a8c4d8; padding-left: 12px; }
  .log .entry.opt.neg { color: #d88a7a; }
  .log .entry.kar-pos { color: #f4d03f; font-size: 13px; }
  .log .entry.kar-neg { color: #6a6a72; font-size: 13px; font-style: italic; }
  .log .entry.nothing { color: #7a7a82; font-style: italic; font-size: 13px; }
  .log .entry.atmos { color: #9aa8b8; font-style: italic; font-size: 13px; }
  .log .entry.danger { color: #e88a7a; font-weight: 600; }
  .log .entry.good { color: #8fd89f; }
  .log .entry.final {
    color: #e8e4dc; font-size: 15px; line-height: 1.8;
    padding: 14px; background: rgba(22, 22, 26, 0.9);
    border-left: 3px solid #e6a850;
    border-radius: 4px; margin-top: 10px;
  }
  .log .entry.final.limbo { border-left-color: #5a1a1a; color: #b0a8a0; }
  .log .entry.final.retorno { border-left-color: #8b3a2a; }

  /* Modales */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.94);
    display: none; justify-content: center; align-items: center;
    z-index: 100; padding: 20px;
    animation: fadeIn 0.4s;
  }
  .overlay.active { display: flex; }
  .overlay-box {
    background: rgba(18, 18, 24, 0.98);
    border: 1px solid rgba(80, 80, 90, 0.5);
    border-radius: 14px;
    padding: 28px;
    max-width: 540px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .overlay-box h2 {
    font-family: 'Cormorant', Georgia, serif;
    font-size: 20px; font-weight: 400;
    color: #e8e4dc; letter-spacing: 4px;
    text-align: center; margin-bottom: 6px;
  }
  .overlay-box .intro {
    text-align: center; color: #8a8a92;
    font-size: 12px; margin-bottom: 20px;
    font-style: italic; line-height: 1.5;
  }
  .origin-btn {
    display: block; width: 100%;
    text-align: left; padding: 14px 18px; margin-bottom: 10px;
    background: rgba(28, 28, 34, 0.85);
    border: 1px solid rgba(60, 60, 70, 0.5);
    border-radius: 8px; cursor: pointer;
    transition: all 0.15s; color: #d8d4cc;
    font-family: inherit;
  }
  .origin-btn:hover { background: rgba(38, 38, 46, 0.95); border-color: rgba(120,120,140,0.6); }
  .origin-btn .oname { font-size: 15px; font-weight: 600; color: #e8e4dc; letter-spacing: 1px; margin-bottom: 4px; display: block; }
  .origin-btn .odesc { font-size: 12px; color: #9a9aa2; line-height: 1.5; margin-bottom: 6px; }
  .origin-btn .opow { color: #8fd89f; font-size: 11px; display: block; margin-bottom: 2px; }
  .origin-btn .omal { color: #e88a7a; font-size: 11px; display: block; }

  .enc-box {
    background: rgba(18, 18, 24, 0.98);
    border: 1px solid rgba(80, 80, 90, 0.5);
    border-radius: 12px;
    padding: 24px;
    max-width: 580px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .enc-name {
    font-family: 'Cormorant', Georgia, serif;
    font-size: 20px; color: #e6a850;
    letter-spacing: 2px; text-align: center;
    margin-bottom: 14px;
  }
  .enc-dial {
    font-style: italic; color: #c8c4bc; font-size: 14px;
    line-height: 1.7; padding: 12px 16px;
    border-left: 2px solid rgba(80,80,90,0.5);
    background: rgba(14,14,18,0.8); border-radius: 4px;
    margin-bottom: 16px;
  }
  .enc-q { color: #f0e6d2; font-size: 14px; margin-bottom: 14px; font-weight: 500; }
  .enc-opt {
    display: block; width: 100%; text-align: left;
    padding: 12px 16px; margin-bottom: 8px;
    background: rgba(28,28,34,0.85);
    border: 1px solid rgba(60,60,70,0.5);
    border-radius: 6px; color: #d8d4cc;
    cursor: pointer; font-family: inherit; font-size: 13px;
    line-height: 1.5; transition: all 0.15s;
  }
  .enc-opt:hover { background: rgba(40,40,48,0.95); border-color: rgba(120,120,140,0.6); }

  @media (max-width: 600px) {
    .container { padding: 14px; }
    h1 { font-size: 22px; letter-spacing: 5px; }
    .log { height: 200px; font-size: 13px; }
    .karma-star { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="fogBg"></div>
<div id="dangerVignette"></div>

<div class="app">
  <div class="container" id="container">
    <h1>LA NIEBLA</h1>
    <div class="subtitle">Un viaje por el Vacío</div>

    <div class="karma-panel" id="karmaPanel"></div>

    <div class="deriva-wrap">
      <div class="deriva-header">
        <span class="deriva-band" id="derivaBandName">Zona Neutra — Infancia / Juventud</span>
        <span class="deriva-val" id="derivaVal">0</span>
      </div>
      <div class="deriva-bar">
        <div class="band-seg b1" id="seg1">QUIETUD</div>
        <div class="band-seg b2" id="seg2">ADULTEZ</div>
        <div class="band-seg b3" id="seg3">INFANCIA</div>
        <div class="band-seg b4" id="seg4">ADULTEZ</div>
        <div class="band-seg b5" id="seg5">DERIVA</div>
      </div>
    </div>

    <div class="limbo-wrap" id="limboWrap">
      <div class="limbo-title">Cuenta del Limbo</div>
      <div class="limbo-count" id="limboCount">10</div>
    </div>

    <div class="controls">
      <button class="walk" id="btnWalk" onclick="decidir('caminar')">🚶 Caminar</button>
      <button class="stay" id="btnStay" onclick="decidir('quedarse')">🧍 Quedarse</button>
    </div>

    <div class="extra-controls">
      <button id="btnHabilidad" style="display:none;" onclick="usarHabilidad()"></button>
      <button id="btnReiniciar" style="display:none;" onclick="reiniciar()">🔄 Nuevo Ciclo</button>
    </div>

    <div class="log" id="log"></div>
  </div>
</div>

<div class="overlay active" id="overlayOrigen">
  <div class="overlay-box">
    <h2>EL RITO DEL ORIGEN</h2>
    <p class="intro">Abres los ojos en la niebla. No ves tus manos.<br>Pero recuerdas quién fuiste.</p>
    <button class="origin-btn" onclick="elegirOrigen('soldado')">
      <span class="oname">⚔️ El Soldado</span>
      <span class="odesc">Un hombre o mujer de mil batallas. Sobreviviste a todo.</span>
      <span class="opow">+ Sabes aguantar más que nadie.</span>
      <span class="omal">− Cada vez que fallas, la Niebla se espesa más rápido.</span>
    </button>
    <button class="origin-btn" onclick="elegirOrigen('enano')">
      <span class="oname">⚒️ El Enano Herrero</span>
      <span class="odesc">Famoso por forjar mithril. Tus manos crearon cosas hermosas.</span>
      <span class="opow">+ Una vez por ciclo: reparar tu cuerpo.</span>
      <span class="omal">− La Niebla te reconoce: empiezas con ella más espesa.</span>
    </button>
    <button class="origin-btn" onclick="elegirOrigen('elfo')">
      <span class="oname">🧝 El Elfo Mago</span>
      <span class="odesc">Alto, antiguo, dominabas los elementos.</span>
      <span class="opow">+ Una vez por ciclo: Escuchar la Niebla.</span>
      <span class="omal">− La magia cuesta: cada vez que Escuchas, pierdes Presencia.</span>
    </button>
  </div>
</div>

<div class="overlay" id="overlayEnc">
  <div class="enc-box">
    <div class="enc-name" id="encName"></div>
    <div class="enc-dial" id="encDial"></div>
    <div class="enc-q" id="encQ"></div>
    <div id="encOpts"></div>
  </div>
</div>

<script>
/* ============================================================
   20 FRASES DE "NADA PASA"
   ============================================================ */
const FRASES_NADA = [
  'Caminas. La niebla no se mueve.',
  'El silencio se prolonga.',
  'No hay nada. Solo tú.',
  'El aire está quieto.',
  'Sigues adelante sin encontrar nada.',
  'El tiempo pasa sin dejar huella.',
  'La niebla te ignora.',
  'No hay rostros. No hay voces.',
  'Solo el latido de tu pecho.',
  'El vacío te acompaña.',
  'Nada cambia. Nada se mueve.',
  'La niebla sigue igual de espesa.',
  'Avanzas sin rumbo. Sin destino.',
  'El silencio no se rompe.',
  'Tu respiración es lo único que oyes.',
  'La nada te rodea.',
  'Nadie viene. Nadie va.',
  'El mundo sigue vacío.',
  'Caminas. Nada más.',
  'Solo niebla. Siempre niebla.'
];

/* ============================================================
   20 FRASES ATMOSFÉRICAS
   ============================================================ */
const FRASES_ATMOS = [
  'El viento sopla. Frío. Muy frío.',
  'Un escalofrío te recorre la espalda.',
  'La angustia te llena el pecho.',
  'Escuchas algo lejano. O crees escucharlo.',
  'El frío se cuela por tus huesos.',
  'Un peso invisible te oprime.',
  'La niebla susurra algo que no entiendes.',
  'Sientes que alguien te observa.',
  'El aire huele a ceniza.',
  'Un temblor recorre tu cuerpo.',
  'La soledad te golpea de pronto.',
  'Escuchas un latido. No es el tuyo.',
  'El frío te abraza como una mano.',
  'Algo se mueve en la niebla. O no.',
  'La tristeza te inunda sin razón.',
  'Sientes que olvidas algo importante.',
  'El viento trae un olor a flores muertas.',
  'Un suspiro. Cerca. Muy cerca.',
  'La niebla se vuelve más densa. O más fría.',
  'Presientes que algo te sigue.'
];

/* ============================================================
   30 ENCUENTROS
   ============================================================ */
const ENCUENTROS = {
  1: [
    { id:'1-1', nombre:'Tu Esposa Moribunda', camina:'Te ve llegar desde la cama. "¿Por qué caminas ahora? Toda la vida te quedaste quieto. Y ahora que me muero, te mueves. Qué ironía."', quieto:'Aquí estás. Como siempre. A mi lado. Callado. No sé si es amor o costumbre. Pero te agradezco.', pregunta:'¿Alguna vez deseaste haberme dejado?', opciones:[{ texto:'Nunca. Fuiste mi única vida.', karma:1 },{ texto:'A veces. Pero me quedé.', karma:-1 }]},
    { id:'1-2', nombre:'Tus Hijos que se Fueron', camina:'Nos dejaste. No como nosotros a ti, sino al revés. Tú te quedaste, nosotros volamos. Y ahora volvemos, y ya no estás.', quieto:'Nos criaste. Nos viste ir. Nunca nos pediste que volviéramos. Y nunca volvimos.', pregunta:'¿Nos perdonas por habernos ido?', opciones:[{ texto:'Siempre. La vida es de los que se van.', karma:1 },{ texto:'No. Me dejaron solo.', karma:-1 }]},
    { id:'1-3', nombre:'El Sacerdote de la Extremaunción', camina:'Te vi caminar hacia mí. Cojeando. Como si aún buscaras algo. Pero ya no hay nada que buscar, hijo.', quieto:'Aquí estás. En la misma banca donde te bauticé. Donde te casé. Donde enterré a tu esposa. Y ahora te entierro a ti.', pregunta:'¿Estás en paz con Dios?', opciones:[{ texto:'Sí. Hice lo que pude.', karma:1 },{ texto:'No. Nunca creí del todo.', karma:-1 }]},
    { id:'1-4', nombre:'El Sepulturero', camina:'Te veo llegar. Es raro. Normalmente la gente llega en caja. Tú llegas a pie.', quieto:'Esta es tu tumba. Al lado de la de ella. Como pediste. La tierra aquí es blanda. Blanda como toda esta vida.', pregunta:'¿Quieres que te entierre con algo?', opciones:[{ texto:'Con nada. Me voy como vine.', karma:1 },{ texto:'Con todo. Que me recuerden.', karma:-1 }]},
    { id:'1-5', nombre:'La Casa Vacía', camina:'Nunca caminaste lejos de mí. Pero ahora que lo haces, te extraño. Aunque nunca me hablaste.', quieto:'Aquí envejeciste. Aquí lloraste. Aquí reíste una vez, creo recordar. Aquí morirás. Y yo seguiré aquí.', pregunta:'¿Alguna vez me consideraste un hogar?', opciones:[{ texto:'Siempre. Eras mi refugio.', karma:1 },{ texto:'Eras solo paredes.', karma:-1 }]},
    { id:'1-6', nombre:'Tu Propio Reflejo', camina:'Mírate. Caminaste toda la vida... y terminaste aquí. Solo. Viejo. Sin nadie. ¿Valió la pena?', quieto:'Mírate. Te quedaste toda la vida... y terminaste aquí. Solo. Viejo. Sin nadie. ¿Valió la pena?', pregunta:'¿Volverías a vivir la misma vida?', opciones:[{ texto:'Sí. Fue mi vida. La acepto.', karma:1 },{ texto:'No. No valió la pena.', karma:-1 }]}
  ],
  2: [
    { id:'2-1', nombre:'La Esposa Joven', camina:'Llegaste tarde a nuestra boda. Como siempre. Pero llegaste. Y eso bastó.', quieto:'Estabas quieto en el altar. Como siempre. Y yo te miré y supe que sería así toda la vida.', pregunta:'¿Alguna vez te arrepentiste de haberme elegido?', opciones:[{ texto:'Nunca. Fuiste mi destino.', karma:1 },{ texto:'A veces. Pero me quedé.', karma:-1 }]},
    { id:'2-2', nombre:'La Esposa Embarazada', camina:'Estabas fuera cuando nació. Trabajando. Llegaste tres días después. Con las manos vacías y los ojos llenos.', quieto:'Estabas aquí. En la puerta. Sin moverte. Viéndome parir. Sin decir nada. Pero estabas.', pregunta:'¿Sentiste miedo de ser padre?', opciones:[{ texto:'Sí. Pero me quedé.', karma:1 },{ texto:'No. Era mi deber.', karma:-1 }]},

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = id => document.getElementById(id);
const d6 = () => Math.floor(Math.random() * 6) + 1;

function log(texto, clase = 'sys') {
  const el = $('log');
  const div = document.createElement('div');
  div.className = 'entry ' + clase;
  div.innerHTML = texto.replace(/\n/g, '<br>');
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function limpiarLog() { $('log').innerHTML = ''; }

function getBanda(deriva) {
  if (deriva <= -6) return 1;
  if (deriva <= -3) return 2;
  if (deriva <= 2) return 3;
  if (deriva <= 5) return 4;
  return 5;
}

function getNieblaNivel(turno) {
  return Math.min(10, Math.floor(turno / 5) + 1);
}

function sacarFraseNada() {
  if (S.frasesNadaUsadas.length >= FRASES_NADA.length) S.frasesNadaUsadas = [];
  const disponibles = FRASES_NADA.map((_, i) => i).filter(i => !S.frasesNadaUsadas.includes(i));
  const idx = disponibles[Math.floor(Math.random() * disponibles.length)];
  S.frasesNadaUsadas.push(idx);
  return FRASES_NADA[idx];
}

function sacarFraseAtmos() {
  if (S.frasesAtmosUsadas.length >= FRASES_ATMOS.length) S.frasesAtmosUsadas = [];
  const disponibles = FRASES_ATMOS.map((_, i) => i).filter(i => !S.frasesAtmosUsadas.includes(i));
  const idx = disponibles[Math.floor(Math.random() * disponibles.length)];
  S.frasesAtmosUsadas.push(idx);
  return FRASES_ATMOS[idx];
}

function actualizarFondo() {
  const nivel = S.nieblaNivel;
  const img = $('fogBg');
  if (!img.dataset.current || img.dataset.current !== String(nivel)) {
    img.classList.add('fade');
    setTimeout(() => {
      img.style.backgroundImage = `url('Niebla/F${nivel}.png')`;
      img.dataset.current = String(nivel);
      img.classList.remove('fade');
    }, 300);
  }
}

function actualizarKarma() {
  const panel = $('karmaPanel');
  panel.innerHTML = '';
  const k = S.karma;
  const abs = Math.min(5, Math.abs(k));
  const tipo = k > 0 ? 'yellow' : k < 0 ? 'black' : 'empty';
  for (let i = 0; i < 5; i++) {
    const star = document.createElement('span');
    star.className = 'karma-star ' + (i < abs ? tipo : 'empty');
    star.textContent = '★';
    panel.appendChild(star);
  }
}

function actualizarDanger() {
  const ratio = S.presencia / S.maxPresencia;
  const vig = $('dangerVignette');
  const cont = $('container');
  vig.classList.remove('warn', 'critical');
  cont.classList.remove('danger');
  if (ratio <= 0.15) {
    vig.classList.add('critical');
    cont.classList.add('danger');
  } else if (ratio <= 0.35) {
    vig.classList.add('warn');
    cont.classList.add('danger');
  }
}

function actualizarUI() {
  actualizarKarma();
  actualizarDanger();

  const banda = getBanda(S.deriva);
  $('derivaVal').textContent = S.deriva;
  $('derivaBandName').textContent = `${BANDAS[banda].nombre} — ${BANDAS[banda].etapa}`;
  for (let i = 1; i <= 5; i++) $('seg' + i).classList.toggle('active', i === banda);

  if (S.limboActivo) {
    $('limboWrap').classList.add('active');
    $('limboCount').textContent = S.cuentaLimbo;
  } else {
    $('limboWrap').classList.remove('active');
  }

  const activo = S.fase === 'juego' && !S.esperandoRespuesta;
  $('btnWalk').disabled = !activo;
  $('btnStay').disabled = !activo;

  const btn = $('btnHabilidad');
  if (S.fase === 'juego' && !S.habilidadUsada && S.origin !== 'soldado') {
    btn.style.display = 'inline-block';
    btn.textContent = S.origin === 'enano' ? '⚒️ Reparar cuerpo' : '🧝 Escuchar la Niebla';
  } else {
    btn.style.display = 'none';
  }

  actualizarFondo();
}

/* ============================================================
   ORIGEN
   ============================================================ */
function elegirOrigen(o) {
  S = estadoInicial();
  S.origin = o;
  S.fase = 'juego';
  if (o === 'soldado') { S.maxPresencia = 25; S.presencia = 25; }
  else if (o === 'enano') { S.nieblaNivel = 2; S.turno = 4; }

  $('overlayOrigen').classList.remove('active');
  limpiarLog();

  const nombres = { soldado:'⚔️ El Soldado', enano:'⚒️ El Enano Herrero', elfo:'🧝 El Elfo Mago' };
  log(`Recuerdas quién fuiste: ${nombres[o]}.`, 'sys');
  log('La niebla te rodea. No ves tus manos. No sabes si estás arriba o abajo.', 'sys');
  log('Cada turno decides: ¿caminar hacia adelante, o quedarte quieto?', 'sys');
  actualizarUI();
}

/* ============================================================
   DECISIÓN
   ============================================================ */
function decidir(accion) {
  if (S.fase !== 'juego' || S.esperandoRespuesta) return;
  S.ultimaDecision = accion;
  S.turno++;
  S.nieblaNivel = getNieblaNivel(S.turno);

  if (accion === 'caminar') {
    S.deriva++;
    S.totalCaminar++;
    log('🚶 Caminas. La niebla se agita.', 'walk');
  } else {
    S.deriva--;
    S.totalQuedarse++;
    log('🧍 Te quedas quieto. La niebla se espesa.', 'stay');
  }

  if (S.deriva >= 10) { actualizarUI(); return irAlCentro(); }
  if (S.deriva <= -10) { actualizarUI(); return finalDisolucion('absorbido'); }

  if (S.limboActivo) {
    log('La niebla está vacía. No hay rostros. Solo tú.', 'nothing');
  } else {
    const roll = S.proximaTirada !== null ? S.proximaTirada : d6();
    if (S.proximaTirada !== null) {
      log(`🧝 Escuchaste la Niebla: la tirada era ${roll}.`, 'sys');
      S.proximaTirada = null;
    } else {
      log(`🎲 Tirada: ${roll}`, 'sys');
    }

    if (roll <= 4) {
      // 4/6 = 2/3 → encuentro
      const banda = getBanda(S.deriva);
      const disponibles = ENCUENTROS[banda].filter(e => !S.encuentrosVisitados.includes(e.id));
      if (disponibles.length > 0) {
        const enc = disponibles[Math.floor(Math.random() * disponibles.length)];
        return mostrarEncuentro(enc);
      } else {
        S.limboActivo = true;
        S.cuentaLimbo = 10;
        log('🌫️ La niebla ya no te muestra rostros. Has agotado los encuentros de esta etapa.', 'danger');
        log('CUENTA DEL LIMBO: 10 turnos.', 'danger');
      }
    } else if (roll === 5) {
      // 1/6 → nada (20 frases)
      log(sacarFraseNada(), 'nothing');
    } else {
      // 1/6 → atmósfera (20 frases)
      log(sacarFraseAtmos(), 'atmos');
    }
  }

  finalizarTurno();
}

/* ============================================================
   FINALIZAR TURNO
   ============================================================ */
function finalizarTurno() {
  const nivel = S.nieblaNivel;
  let dano = DANO_POR_NIVEL[nivel] || 0;

  if (S.karma >= 5) dano = Math.max(0, dano - 1);
  if (S.karma <= -5) dano += 1;

  if (dano > 0) {
    S.presencia -= dano;
    // No mostramos número, solo una advertencia vaga
    if (S.presencia <= 5) {
      log('Sientes que algo dentro de ti se apaga.', 'danger');
    } else {
      log('La niebla te consume lentamente.', 'danger');
    }
  }

  if (S.presencia <= 0) { actualizarUI(); return finalDisolucion('apagado'); }

  if (S.limboActivo) {
    S.cuentaLimbo--;
    log(`⏳ Cuenta del Limbo: ${S.cuentaLimbo}`, 'danger');
    if (S.cuentaLimbo <= 0) { actualizarUI(); return finalLimbo(); }
  }

  actualizarUI();
}

/* ============================================================
   ENCUENTRO
   ============================================================ */
function mostrarEncuentro(enc) {
  S.esperandoRespuesta = true;
  S.encuentrosVisitados.push(enc.id);
  const banda = getBanda(S.deriva);
  S.bandasVisitadas[banda]++;

  const dialogo = S.ultimaDecision === 'caminar' ? enc.camina : enc.quieto;

  log(`— ${enc.nombre} —`, 'enc');
  log(`"${dialogo}"`, 'dial');

  $('encName').textContent = enc.nombre;
  $('encDial').textContent = `"${dialogo}"`;
  $('encQ').textContent = enc.pregunta;

  const opts = $('encOpts');
  opts.innerHTML = '';
  enc.opciones.forEach((op, i) => {
    const btn = document.createElement('button');
    btn.className = 'enc-opt';
    btn.textContent = (i === 0 ? '🅰️ ' : '🅱️ ') + op.texto;
    btn.onclick = () => responder(enc, op);
    opts.appendChild(btn);
  });

  $('overlayEnc').classList.add('active');
  actualizarUI();
}

function responder(enc, opcion) {
  $('overlayEnc').classList.remove('active');
  S.esperandoRespuesta = false;

  log(`> ${opcion.texto}`, opcion.karma > 0 ? 'opt' : 'opt neg');
  S.karma += opcion.karma;

  if (opcion.karma > 0) {
    log(`✨ Una estrella se enciende.`, 'kar-pos');
  } else {
    log(`🌑 Una estrella se apaga.`, 'kar-neg');
    if (S.origin === 'soldado') {
      S.turno += 1;
      S.nieblaNivel = getNieblaNivel(S.turno);
      log(`⚔️ La guerra te persigue.`, 'danger');
    }
  }

  actualizarUI();
  finalizarTurno();
}

/* ============================================================
   HABILIDAD
   ============================================================ */
function usarHabilidad() {
  if (S.habilidadUsada || S.fase !== 'juego') return;
  if (S.origin === 'enano') {
    S.presencia = Math.min(S.maxPresencia, S.presencia + 6);
    S.habilidadUsada = true;
    log('⚒️ Reparas tu cuerpo con viejas memorias de hierro.', 'good');
  } else if (S.origin === 'elfo') {
    if (S.presencia <= 3) return;
    S.presencia -= 3;
    S.proximaTirada = d6();
    S.habilidadUsada = true;
    log('🧝 Escuchas la Niebla. Pagas con un poco de ti.', 'good');
    log(`   La próxima tirada será: ${S.proximaTirada}`, 'sys');
  }
  actualizarUI();
}

/* ============================================================
   FINALES
   ============================================================ */
function irAlCentro() {
  S.fase = 'centro';
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('Llegas al Centro. La niebla se detiene. Por primera vez, hay silencio.', 'sys');
  log('Frente a ti, un reflejo. Tú mismo. Sin filtros.', 'sys');
  log('"Ya casi sabes quién eres. ¿Quieres saberlo?"', 'dial');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  setTimeout(mostrarFinal, 500);
}

function mostrarFinal() {
  S.fase = 'final';
  const activo = S.totalCaminar > S.totalQuedarse;
  const salvacion = S.karma >= 5;
  const clave = `${S.origin}-${activo ? 'activo' : 'pasivo'}-${salvacion ? 'salvacion' : 'retorno'}`;
  const final = FINALES[clave];

  let bandaDom = 3, maxVisitas = 0;
  for (let b = 1; b <= 5; b++) {
    if (S.bandasVisitadas[b] > maxVisitas) { maxVisitas = S.bandasVisitadas[b]; bandaDom = b; }
  }
  const parrafoBanda = BANDA_FINAL[bandaDom];

  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log(`🏁 FINAL: "${final.titulo}"`, salvacion ? 'good' : 'danger');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log(final.texto, 'final');
  log(parrafoBanda, 'final');

  $('btnWalk').disabled = true;
  $('btnStay').disabled = true;
  $('btnHabilidad').style.display = 'none';
  $('btnReiniciar').style.display = 'inline-block';
  actualizarUI();
}

function finalDisolucion(tipo) {
  S.fase = 'final';
  const textos = DISOLUCION[S.origin];
  const titulos = { disuelto:'DISUELTO', apagado:'APAGADO', absorbido:'ABSORBIDO' };
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log(`☠️ ${titulos[tipo]}`, 'danger');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log(textos[tipo], 'final retorno');

  $('btnWalk').disabled = true;
  $('btnStay').disabled = true;
  $('btnHabilidad').style.display = 'none';
  $('btnReiniciar').style.display = 'inline-block';
  actualizarUI();
}

function finalLimbo() {
  S.fase = 'final';
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('🌑 EL LIMBO', 'danger');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('Y entonces, sin ruido, sin dolor, sin despedida, dejas de estar. No mueres. No descansas. No recuerdas. No eres.', 'final limbo');
  log(LIMBO[S.origin], 'final limbo');
  log(LIMBO_CIERRE, 'final limbo');

  $('btnWalk').disabled = true;
  $('btnStay').disabled = true;
  $('btnHabilidad').style.display = 'none';
  $('btnReiniciar').style.display = 'inline-block';
  actualizarUI();
}

function reiniciar() {
  S = estadoInicial();
  $('overlayOrigen').classList.add('active');
  $('btnReiniciar').style.display = 'none';
  limpiarLog();
  actualizarUI();
}

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
S = estadoInicial();
actualizarUI();
</script>
</body>
</html>
